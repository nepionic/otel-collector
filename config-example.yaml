# Example otelcol-ads collector configuration.
#
# Run the collector:
#   ./dist/otelcol-ads --config config.yaml

extensions:
  zpages:
    endpoint: 0.0.0.0:55679

receivers:
  # ---------------------------------------------------------------------------
  # ADS Logs receiver – reads from the TwinCAT OtelBridge log ring buffer.
  # The companion library wraps FB_TcEventLogger and writes records into
  # OtelBridge.LogRing (ST_OtelLogRing).
  # ---------------------------------------------------------------------------
  adsevents:
    target_net_id: "192.168.1.1.1.1"   # AMS Net ID of the TwinCAT system
    plc_port: 851
    # router_addr: "192.168.1.1"        # Set for direct TCP (no local TwinCAT router)
    router_port: 48898
    state_polling_interval: 2s
    subscription_cycle_time: 100ms
    connect_retry_initial_interval: 1s  # first backoff after a failed attempt
    connect_retry_max_interval: 30s     # backoff ceiling (doubles each attempt)

    # System logs – collector-generated events the PLC cannot supply itself:
    #   - TwinCAT ADS state changes  (Run ↔ Stop, Config, Error, …)
    #   - TCP connection established / lost / reconnected after restart
    #   - Log ring buffer overflows  (PLC writing faster than collector drains)
    # All sub-options default to true; set enabled: false to silence all of them.
    system_logs:
      enabled: true
      plc_state_changes: true   # Run→Stop, Config→Run, initial state, …
      connection_events: true   # connected, connection lost, reconnected
      ring_overflows: true      # warn when PLC ring laps the collector

  # ---------------------------------------------------------------------------
  # ADS Metrics receiver – two complementary paths.
  # ---------------------------------------------------------------------------
  adsmetrics:
    target_net_id: "192.168.1.1.1.1"
    plc_port: 851
    # router_addr: "192.168.1.1"
    router_port: 48898
    state_polling_interval: 2s
    connect_retry_initial_interval: 1s
    connect_retry_max_interval: 30s

    # Pull path – subscribe to named PLC symbols directly.
    # Add or remove entries as needed; no PLC-side companion library required.
    subscriptions:
      - symbol: "MAIN.temperature"
        name: "plc.reactor.temperature"
        unit: "Cel"
        description: "Reactor temperature sensor"
        type: gauge
        cycle_time: 500ms
        send_on_change: true

      - symbol: "MAIN.production_count"
        name: "plc.production.items_total"
        unit: "{items}"
        description: "Total items produced since PLC start"
        type: counter
        cycle_time: 1s
        send_on_change: true

      - symbol: "MAIN.conveyor_speed"
        name: "plc.conveyor.speed"
        unit: "mm/s"
        description: "Conveyor belt speed"
        type: gauge
        cycle_time: 200ms
        send_on_change: true

    # Push path – reads from the TwinCAT OtelBridge lock-free metric ring.
    # Enable when the companion library is integrated in the PLC project.
    push_ring:
      enabled: false
      symbol: "OtelBridge.MetricRing"
      subscription_cycle_time: 100ms

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  batch:
    send_batch_size: 1000
    timeout: 1s

  # Stamp every log/metric with site-specific metadata the PLC cannot supply.
  # Values can be literals or ${env:VAR_NAME} references (resolved at startup).
  resource:
    attributes:
      - key: site.id
        value: "${env:SITE_ID}"
        action: upsert
      - key: deployment.region
        value: "${env:SITE_REGION}"
        action: upsert
      # - key: site.name
      #   value: "Acme Plant 3"
      #   action: upsert
      # - key: machine.id
      #   value: "${env:MACHINE_ID}"
      #   action: upsert

exporters:
  # Send everything to an OTLP-compatible backend (Grafana, Jaeger, etc.)
  otlp:
    endpoint: "localhost:4317"
    tls:
      insecure: true

  # Print everything to stdout for local development / debugging.
  debug:
    verbosity: detailed

service:
  extensions: [zpages]

  pipelines:
    logs:
      receivers: [adsevents]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp, debug]

    metrics:
      receivers: [adsmetrics]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp, debug]
