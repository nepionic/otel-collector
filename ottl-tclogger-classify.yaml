          # ---- faults ----
          # Exception (Exception Code: 0xc000008e, FPU zero divide) in PLC Application Nepionic_OTel_IntegrationTest Instance, Task PlcTask (RBP: 0x737819fbc0, RIP: 0x250ba4e08c7, RSP: 0x737819fa90), Area 1, Offset 0x155c7
          - 'merge_maps(attributes, ExtractPatterns(body, "^Exception \\(Exception Code: (?P<tclogger_exception_code>0x[0-9a-fA-F]+), (?P<tclogger_exception_reason>[^)]+)\\) in PLC Application (?P<tclogger_plc_application>\\S+) Instance, Task (?P<tclogger_task>\\S+) \\(RBP: (?P<tclogger_rbp>0x[0-9a-fA-F]+), RIP: (?P<tclogger_rip>0x[0-9a-fA-F]+), RSP: (?P<tclogger_rsp>0x[0-9a-fA-F]+)\\), Area (?P<tclogger_area>\\d+), Offset (?P<tclogger_offset>0x[0-9a-fA-F]+)$"), "insert") where IsMatch(body, "^Exception \\(Exception Code: (?P<tclogger_exception_code>0x[0-9a-fA-F]+), (?P<tclogger_exception_reason>[^)]+)\\) in PLC Application (?P<tclogger_plc_application>\\S+) Instance, Task (?P<tclogger_task>\\S+) \\(RBP: (?P<tclogger_rbp>0x[0-9a-fA-F]+), RIP: (?P<tclogger_rip>0x[0-9a-fA-F]+), RSP: (?P<tclogger_rsp>0x[0-9a-fA-F]+)\\), Area (?P<tclogger_area>\\d+), Offset (?P<tclogger_offset>0x[0-9a-fA-F]+)$")'
          - 'set(attributes["tclogger_pattern"], "plc_exception") where IsMatch(body, "^Exception \\(Exception Code: (?P<tclogger_exception_code>0x[0-9a-fA-F]+), (?P<tclogger_exception_reason>[^)]+)\\) in PLC Application (?P<tclogger_plc_application>\\S+) Instance, Task (?P<tclogger_task>\\S+) \\(RBP: (?P<tclogger_rbp>0x[0-9a-fA-F]+), RIP: (?P<tclogger_rip>0x[0-9a-fA-F]+), RSP: (?P<tclogger_rsp>0x[0-9a-fA-F]+)\\), Area (?P<tclogger_area>\\d+), Offset (?P<tclogger_offset>0x[0-9a-fA-F]+)$")'
          - 'set(attributes["tclogger_category"], "faults") where IsMatch(body, "^Exception \\(Exception Code: (?P<tclogger_exception_code>0x[0-9a-fA-F]+), (?P<tclogger_exception_reason>[^)]+)\\) in PLC Application (?P<tclogger_plc_application>\\S+) Instance, Task (?P<tclogger_task>\\S+) \\(RBP: (?P<tclogger_rbp>0x[0-9a-fA-F]+), RIP: (?P<tclogger_rip>0x[0-9a-fA-F]+), RSP: (?P<tclogger_rsp>0x[0-9a-fA-F]+)\\), Area (?P<tclogger_area>\\d+), Offset (?P<tclogger_offset>0x[0-9a-fA-F]+)$")'
          - 'set(attributes["tclogger_matched"], true) where IsMatch(body, "^Exception \\(Exception Code: (?P<tclogger_exception_code>0x[0-9a-fA-F]+), (?P<tclogger_exception_reason>[^)]+)\\) in PLC Application (?P<tclogger_plc_application>\\S+) Instance, Task (?P<tclogger_task>\\S+) \\(RBP: (?P<tclogger_rbp>0x[0-9a-fA-F]+), RIP: (?P<tclogger_rip>0x[0-9a-fA-F]+), RSP: (?P<tclogger_rsp>0x[0-9a-fA-F]+)\\), Area (?P<tclogger_area>\\d+), Offset (?P<tclogger_offset>0x[0-9a-fA-F]+)$")'


