          - 'merge_maps(attributes, ExtractPatterns(body, "^''TwinCAT IoT Data Agent'': File \"(?P<tclogger_file>[^\"]+)\" not found\\.$"), "insert") where IsMatch(body, "^''TwinCAT IoT Data Agent'': File \"(?P<tclogger_file>[^\"]+)\" not found\\.$")'
          - 'set(attributes["tclogger_pattern"], "iot_data_agent_file_not_found") where IsMatch(body, "^''TwinCAT IoT Data Agent'': File \"(?P<tclogger_file>[^\"]+)\" not found\\.$")'
          - 'set(attributes["tclogger_category"], "diagnostics") where IsMatch(body, "^''TwinCAT IoT Data Agent'': File \"(?P<tclogger_file>[^\"]+)\" not found\\.$")'
          - 'set(attributes["tclogger_matched"], true) where IsMatch(body, "^''TwinCAT IoT Data Agent'': File \"(?P<tclogger_file>[^\"]+)\" not found\\.$")'

