          - 'set(attributes["tclogger_pattern"], "system_service_control_message") where IsMatch(body, "^''TwinCAT System'' \\((?P<tclogger_id>\\d+)\\): TwinCAT System Service Control Message: (?P<tclogger_message>.+)\\.$")'
          - 'set(attributes["tclogger_category"], "diagnostics") where IsMatch(body, "^''TwinCAT System'' \\((?P<tclogger_id>\\d+)\\): TwinCAT System Service Control Message: (?P<tclogger_message>.+)\\.$")'
          - 'set(attributes["tclogger_matched"], true) where IsMatch(body, "^''TwinCAT System'' \\((?P<tclogger_id>\\d+)\\): TwinCAT System Service Control Message: (?P<tclogger_message>.+)\\.$")'

          # The logging of messages has been temporarily halted because too many messages
