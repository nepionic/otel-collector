          - 'merge_maps(attributes, ExtractPatterns(body, "^UASv \\(AxisID (?P<tclogger_axis_id>\\d+), CmdNo=(?P<tclogger_cmd_no>\\d+), (?P<tclogger_state_code>\\d+) \\((?P<tclogger_state_name>\\w+)\\), CurPos=(?P<tclogger_cur_pos>-?[\\d.]+(?:e[+-]?\\d+)?), CurVelo=(?P<tclogger_cur_velo>-?[\\d.]+(?:e[+-]?\\d+)?), CurAcc=(?P<tclogger_cur_acc>-?[\\d.]+(?:e[+-]?\\d+)?)\\) StartPos=(?P<tclogger_start_pos>-?[\\d.]+(?:e[+-]?\\d+)?); EndPos=(?P<tclogger_end_pos>-?[\\d.]+(?:e[+-]?\\d+)?); Velo=(?P<tclogger_velo>-?[\\d.]+(?:e[+-]?\\d+)?); Acc=(?P<tclogger_acc>-?[\\d.]+(?:e[+-]?\\d+)?), Dec=(?P<tclogger_dec>-?[\\d.]+(?:e[+-]?\\d+)?), Jerk=(?P<tclogger_jerk>-?[\\d.]+(?:e[+-]?\\d+)?), Error=0x(?P<tclogger_error_code>[0-9A-Fa-f]+)$"), "insert") where IsMatch(body, "^UASv \\(AxisID (?P<tclogger_axis_id>\\d+), CmdNo=(?P<tclogger_cmd_no>\\d+), (?P<tclogger_state_code>\\d+) \\((?P<tclogger_state_name>\\w+)\\), CurPos=(?P<tclogger_cur_pos>-?[\\d.]+(?:e[+-]?\\d+)?), CurVelo=(?P<tclogger_cur_velo>-?[\\d.]+(?:e[+-]?\\d+)?), CurAcc=(?P<tclogger_cur_acc>-?[\\d.]+(?:e[+-]?\\d+)?)\\) StartPos=(?P<tclogger_start_pos>-?[\\d.]+(?:e[+-]?\\d+)?); EndPos=(?P<tclogger_end_pos>-?[\\d.]+(?:e[+-]?\\d+)?); Velo=(?P<tclogger_velo>-?[\\d.]+(?:e[+-]?\\d+)?); Acc=(?P<tclogger_acc>-?[\\d.]+(?:e[+-]?\\d+)?), Dec=(?P<tclogger_dec>-?[\\d.]+(?:e[+-]?\\d+)?), Jerk=(?P<tclogger_jerk>-?[\\d.]+(?:e[+-]?\\d+)?), Error=0x(?P<tclogger_error_code>[0-9A-Fa-f]+)$")'
          - 'set(attributes["tclogger_pattern"], "uasv_axis_status") where IsMatch(body, "^UASv \\(AxisID (?P<tclogger_axis_id>\\d+), CmdNo=(?P<tclogger_cmd_no>\\d+), (?P<tclogger_state_code>\\d+) \\((?P<tclogger_state_name>\\w+)\\), CurPos=(?P<tclogger_cur_pos>-?[\\d.]+(?:e[+-]?\\d+)?), CurVelo=(?P<tclogger_cur_velo>-?[\\d.]+(?:e[+-]?\\d+)?), CurAcc=(?P<tclogger_cur_acc>-?[\\d.]+(?:e[+-]?\\d+)?)\\) StartPos=(?P<tclogger_start_pos>-?[\\d.]+(?:e[+-]?\\d+)?); EndPos=(?P<tclogger_end_pos>-?[\\d.]+(?:e[+-]?\\d+)?); Velo=(?P<tclogger_velo>-?[\\d.]+(?:e[+-]?\\d+)?); Acc=(?P<tclogger_acc>-?[\\d.]+(?:e[+-]?\\d+)?), Dec=(?P<tclogger_dec>-?[\\d.]+(?:e[+-]?\\d+)?), Jerk=(?P<tclogger_jerk>-?[\\d.]+(?:e[+-]?\\d+)?), Error=0x(?P<tclogger_error_code>[0-9A-Fa-f]+)$")'
          - 'set(attributes["tclogger_category"], "motion") where IsMatch(body, "^UASv \\(AxisID (?P<tclogger_axis_id>\\d+), CmdNo=(?P<tclogger_cmd_no>\\d+), (?P<tclogger_state_code>\\d+) \\((?P<tclogger_state_name>\\w+)\\), CurPos=(?P<tclogger_cur_pos>-?[\\d.]+(?:e[+-]?\\d+)?), CurVelo=(?P<tclogger_cur_velo>-?[\\d.]+(?:e[+-]?\\d+)?), CurAcc=(?P<tclogger_cur_acc>-?[\\d.]+(?:e[+-]?\\d+)?)\\) StartPos=(?P<tclogger_start_pos>-?[\\d.]+(?:e[+-]?\\d+)?); EndPos=(?P<tclogger_end_pos>-?[\\d.]+(?:e[+-]?\\d+)?); Velo=(?P<tclogger_velo>-?[\\d.]+(?:e[+-]?\\d+)?); Acc=(?P<tclogger_acc>-?[\\d.]+(?:e[+-]?\\d+)?), Dec=(?P<tclogger_dec>-?[\\d.]+(?:e[+-]?\\d+)?), Jerk=(?P<tclogger_jerk>-?[\\d.]+(?:e[+-]?\\d+)?), Error=0x(?P<tclogger_error_code>[0-9A-Fa-f]+)$")'
          - 'set(attributes["tclogger_matched"], true) where IsMatch(body, "^UASv \\(AxisID (?P<tclogger_axis_id>\\d+), CmdNo=(?P<tclogger_cmd_no>\\d+), (?P<tclogger_state_code>\\d+) \\((?P<tclogger_state_name>\\w+)\\), CurPos=(?P<tclogger_cur_pos>-?[\\d.]+(?:e[+-]?\\d+)?), CurVelo=(?P<tclogger_cur_velo>-?[\\d.]+(?:e[+-]?\\d+)?), CurAcc=(?P<tclogger_cur_acc>-?[\\d.]+(?:e[+-]?\\d+)?)\\) StartPos=(?P<tclogger_start_pos>-?[\\d.]+(?:e[+-]?\\d+)?); EndPos=(?P<tclogger_end_pos>-?[\\d.]+(?:e[+-]?\\d+)?); Velo=(?P<tclogger_velo>-?[\\d.]+(?:e[+-]?\\d+)?); Acc=(?P<tclogger_acc>-?[\\d.]+(?:e[+-]?\\d+)?), Dec=(?P<tclogger_dec>-?[\\d.]+(?:e[+-]?\\d+)?), Jerk=(?P<tclogger_jerk>-?[\\d.]+(?:e[+-]?\\d+)?), Error=0x(?P<tclogger_error_code>[0-9A-Fa-f]+)$")'

