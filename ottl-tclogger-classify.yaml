          - 'set(attributes["tclogger_pattern"], "axis_generic_error") where IsMatch(body, "^''(?P<tclogger_axis>[^'']+)'' \\(Axis-ID: (?P<tclogger_axis_id>\\d+)\\): (?P<tclogger_detail>.+?) \\(error-code: 0x(?P<tclogger_error_code>[0-9A-Fa-f]+)\\) !$")'
